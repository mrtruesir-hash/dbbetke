name = "dbbetke"
main = "src/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker runs first on every request (not just unmatched routes) so the
# www -> apex redirect in src/index.js can fire before assets are served.
run_worker_first = true

# Non-secret config lives here so it survives every deploy. (Secrets —
# MARKETING_CLIENT_ID / MARKETING_CLIENT_SECRET — stay in the dashboard.)
[vars]
MARKETING_REF = "5376676"
MARKETING_LANG = "en"
MARKETING_COUNT = "20"
